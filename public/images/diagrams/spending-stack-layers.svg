<svg viewBox="0 0 720 652" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <!-- panel background -->
  <rect x="0" y="0" width="720" height="652" rx="16" fill="#f5efe6"/>

  <!-- cairn motif (placeholder until the coin/leaf mark is locked) -->
  <g fill="#a8332a">
    <ellipse cx="360" cy="23" rx="12" ry="8.5"/>
    <rect x="332" y="34" width="56" height="13" rx="6.5"/>
    <rect x="343" y="50" width="34" height="12" rx="6"/>
    <rect x="328" y="65" width="64" height="14" rx="7"/>
  </g>

  <!-- title + subtitle -->
  <text x="360" y="116" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#2a2a2a">How the layers stack</text>
  <text x="360" y="142" text-anchor="middle" font-size="14.5" fill="#6f675c">Each layer is optional. The simplest version is just Layer 1.</text>

  <!-- ===== LAYER 1 ===== -->
  <g>
    <rect x="40" y="170" width="640" height="192" rx="13" fill="#ede4d6" stroke="#dcd0bf" stroke-width="1"/>
    <circle cx="82" cy="212" r="18" fill="#a8332a"/>
    <text x="82" y="219" text-anchor="middle" font-size="19" font-weight="700" fill="#f5efe6">1</text>
    <text x="120" y="202" font-size="12" letter-spacing="1.4" font-weight="600" fill="#a8332a">LAYER 1 · RIGHT CARD PER CATEGORY</text>
    <text x="120" y="228" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#2a2a2a">The foundation</text>
    <rect x="538" y="199" width="118" height="26" rx="13" fill="#a8332a"/>
    <text x="597" y="216" text-anchor="middle" font-size="11.5" letter-spacing="1" font-weight="600" fill="#f5efe6">START HERE</text>

    <line x1="120" y1="250" x2="656" y2="250" stroke="#dcd0bf" stroke-width="1"/>

    <text x="120" y="280" font-size="15.5" xml:space="preserve"><tspan font-weight="600" fill="#2a2a2a">Amex Cobalt</tspan><tspan fill="#6f675c">  &#8594;  eats &amp; drinks</tspan></text>
    <text x="656" y="280" text-anchor="end" font-size="16.5" font-weight="700" fill="#a8332a">5%</text>

    <text x="120" y="314" font-size="15.5" xml:space="preserve"><tspan font-weight="600" fill="#2a2a2a">Scotia Momentum</tspan><tspan fill="#6f675c">  &#8594;  bills &amp; groceries</tspan></text>
    <text x="656" y="314" text-anchor="end" font-size="16.5" font-weight="700" fill="#a8332a">4%</text>

    <text x="120" y="348" font-size="15.5" xml:space="preserve"><tspan font-weight="600" fill="#2a2a2a">Wealthsimple Privilege</tspan><tspan fill="#6f675c">  &#8594;  everything else · 0% FX</tspan></text>
    <text x="656" y="348" text-anchor="end" font-size="16.5" font-weight="700" fill="#a8332a">2%</text>
  </g>

  <!-- ===== LAYER 2 ===== -->
  <g>
    <rect x="40" y="380" width="640" height="116" rx="13" fill="#ede4d6" stroke="#dcd0bf" stroke-width="1"/>
    <circle cx="82" cy="426" r="18" fill="#a8332a"/>
    <text x="82" y="433" text-anchor="middle" font-size="19" font-weight="700" fill="#f5efe6">2</text>
    <text x="120" y="416" font-size="12" letter-spacing="1.4" font-weight="600" fill="#a8332a">LAYER 2 · CASHBACK PORTALS</text>
    <text x="120" y="442" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#2a2a2a">Rakuten + Great Canadian Rebates</text>
    <text x="120" y="471" font-size="14.5" fill="#6f675c">Click through before shopping online, earn % on top of the card.</text>
    <rect x="564" y="413" width="92" height="26" rx="13" fill="none" stroke="#c9a59a" stroke-width="1.2"/>
    <text x="610" y="430" text-anchor="middle" font-size="11.5" letter-spacing="1" font-weight="600" fill="#a8332a">OPTIONAL</text>
  </g>

  <!-- ===== LAYER 3 ===== -->
  <g>
    <rect x="40" y="514" width="640" height="116" rx="13" fill="#ede4d6" stroke="#dcd0bf" stroke-width="1"/>
    <circle cx="82" cy="560" r="18" fill="#a8332a"/>
    <text x="82" y="567" text-anchor="middle" font-size="19" font-weight="700" fill="#f5efe6">3</text>
    <text x="120" y="550" font-size="12" letter-spacing="1.4" font-weight="600" fill="#a8332a">LAYER 3 · PAYMENT ROUTING</text>
    <text x="120" y="576" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#2a2a2a">Chexy</text>
    <text x="120" y="605" font-size="14.5" fill="#6f675c">Route rent and tuition onto Momentum and earn 4%.</text>
    <rect x="564" y="547" width="92" height="26" rx="13" fill="none" stroke="#c9a59a" stroke-width="1.2"/>
    <text x="610" y="564" text-anchor="middle" font-size="11.5" letter-spacing="1" font-weight="600" fill="#a8332a">OPTIONAL</text>
  </g>
</svg>
